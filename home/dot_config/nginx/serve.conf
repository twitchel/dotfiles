# Webroot config for the `serve` shell function: a plain file browser over $PWD.
server {
    listen 80;
    server_name _;

    charset utf-8;
    absolute_redirect off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
