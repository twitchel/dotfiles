on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  apply-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - fedora:44
          - ubuntu:26.04
          # Immutable/atomic Fedora — exercises the rpm-ostree code paths
          - quay.io/fedora/fedora-coreos:stable
    container:
      image: ${{ matrix.os }}
      options: --ulimit nofile=1024:1024
    steps:
      # Atomic/immutable images symlink /home -> var/home, but /var/home is
      # only created by systemd-tmpfiles at boot, so it is missing in a
      # container and Homebrew cannot create /home/linuxbrew.
      - name: Create /var/home on atomic images
        run: "[ -L /home ] && mkdir -p /var/home || true"
      - uses: actions/checkout@v5
      - name: Install dependencies dnf
        run: dnf install -y git curl >/dev/null 2>&1 || echo "no dnf"
      - name: Update apt cache
        run: apt update >/dev/null 2>&1 || echo "no apt"
      - name: Install dependencies apt
        run: apt install -y git curl >/dev/null 2>&1 || echo "no apt"
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/bin
      - name: Init the repo based off the current branch
        run: chezmoi init -S .
      - name: Show the chezmoi data
        run: chezmoi data -S .
      - name: Run the chezmoi apply
        run: chezmoi apply -S .
  apply-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /Users/runner/.local/bin
      - name: echo $PATH
        run: echo $PATH
      - name: which chezmoi
        run: which chezmoi
      - name: Init the repo based off the current branch
        run: chezmoi init -S .
      - name: Show the chezmoi data
        run: chezmoi data -S .
      - name: Run the chezmoi apply
        run: chezmoi apply -S .
